name: Automated GEO Discovery & Ingestion Cron

on:
  schedule:
    # Run every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      question_count:
        description: "Number of questions to ingest"
        required: false
        default: "2"
      force_fallback:
        description: "Force curated fallback without Reddit API"
        required: false
        type: boolean
        default: false

concurrency:
  group: geo-cron-pipeline
  cancel-in-progress: false

jobs:
  run-geo-pipeline:
    name: Scrape, Ground & Ingest Q&A
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f automation/requirements.txt ]; then
            pip install -r automation/requirements.txt
          fi

      - name: Run GEO Ingestion Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          python automation/run_pipeline.py --count ${{ inputs.question_count || 2 }} ${{ inputs.force_fallback && '--force-fallback' || '' }}
